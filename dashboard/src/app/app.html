<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name mono">agents<span class="muted">·dash</span></span>
    </div>
    <nav>
      @for (item of nav; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active" class="nav-item">
          {{ item.label }}
        </a>
      }
    </nav>
    <div class="sidebar-footer">
      <div class="status-row">
        <span class="dot" [class.on]="connected()"></span>
        <span class="muted">Realtime {{ connected() ? 'conectado' : 'off' }}</span>
      </div>
      <div class="status-row">
        <span class="dot" [class.on]="opencodeOk()"></span>
        <span class="muted">OpenCode {{ opencodeOk() === null ? '…' : (opencodeOk() ? 'OK' : 'caído') }}</span>
      </div>
    </div>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
