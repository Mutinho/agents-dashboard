server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: todo a index.html salvo ficheros reales.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy REST al orquestador.
    location /api/ {
        proxy_pass http://orchestrator:8787/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy WebSocket al orquestador (eventos en vivo).
    # El server WS escucha en la raíz de :8788; reescribimos /ws -> / con la barra final.
    location /ws {
        proxy_pass http://orchestrator:8788/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
