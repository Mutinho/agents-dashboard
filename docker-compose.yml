name: agents-dashboard

services:
  # ---------------------------------------------------------------------------
  # OpenCode: motor de agentes (server HTTP headless) conectado a OpenRouter.
  # ---------------------------------------------------------------------------
  opencode:
    build:
      context: ./config/opencode
      dockerfile: Dockerfile
    container_name: ad-opencode
    restart: unless-stopped
    # Cascada de entorno: .env (base) -> .env.local (overrides, opcional, gana).
    # Para que .env.local pise TAMBIÉN la interpolación ${...} de este fichero,
    # invoca compose vía `make` / `./dc.sh` (usa --env-file .env --env-file .env.local).
    env_file:
      - path: .env
        required: true
      - path: .env.local
        required: false
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env}
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
    volumes:
      # Config de OpenCode (opencode.jsonc + agentes) como solo-lectura
      - ./config/opencode/opencode.jsonc:/root/.config/opencode/opencode.jsonc:ro
      - ./config/opencode/agents:/root/.config/opencode/agents:ro
      # Skills (markdown + datos/scripts); ui-ux-pro-max usa Python (incluido en la imagen)
      - ./config/opencode/skills:/root/.config/opencode/skills:ro
      # Estado persistente de OpenCode (sesiones, auth, etc.)
      - ./data/opencode:/root/.local/share/opencode
      # Workspaces internos (modo "vacío", sin proyecto real)
      - ./workspaces:/workspaces
      # Raíz de proyectos REALES del host (carpetas locales + repos clonados).
      # Montada en la misma ruta /projects en opencode y orchestrator.
      - ${PROJECTS_ROOT:-./data/projects}:/projects
    ports:
      # Publicado SOLO en loopback del host
      - "127.0.0.1:${OPENCODE_PORT:-4096}:4096"
    healthcheck:
      # Incluye basic-auth (-u) porque el server exige credenciales.
      test: ["CMD-SHELL", "curl -fsS -u \"$${OPENCODE_SERVER_USERNAME:-opencode}:$${OPENCODE_SERVER_PASSWORD}\" http://localhost:4096/global/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Postgres: persistencia del dominio (proyectos, agentes, conversaciones...).
  # Declarado ya; se usará desde la Fase 3.
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16
    container_name: ad-db
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
      - path: .env.local
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-own_ia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-own_ia}
    volumes:
      - ./data/db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-own_ia} -d ${POSTGRES_DB:-own_ia}"]
      interval: 10s
      timeout: 5s
      retries: 10
    profiles: ["full"]

  # ---------------------------------------------------------------------------
  # NATS: bus de mensajes entre agentes (pub/sub). Declarado ya; Fase 4.
  # ---------------------------------------------------------------------------
  broker:
    image: nats:latest
    container_name: ad-broker
    restart: unless-stopped
    command: ["-js"]
    ports:
      - "127.0.0.1:${NATS_PORT:-4222}:4222"
    profiles: ["full"]

  # ---------------------------------------------------------------------------
  # Orchestrator: núcleo multi-agente (REST + WS). Habla con opencode y db por
  # la red interna de Docker (no sale a internet, no necesita la CA corporativa).
  # ---------------------------------------------------------------------------
  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    container_name: ad-orchestrator
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
      - path: .env.local
        required: false
    environment:
      OPENCODE_URL: http://opencode:4096
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      ORCH_REST_PORT: 8787
      ORCH_WS_PORT: 8788
      NATS_URL: nats://broker:4222
      # Timeout por turno de agente (robustez modo autónomo). Default 6 min.
      TURN_TIMEOUT_MS: ${TURN_TIMEOUT_MS:-180000}
      # Raíz de proyectos (dentro del contenedor). Clona repos aquí.
      PROJECTS_DIR: /projects
    volumes:
      # Misma raíz de proyectos reales, misma ruta que en opencode.
      - ${PROJECTS_ROOT:-./data/projects}:/projects
    ports:
      - "127.0.0.1:${ORCH_REST_PORT:-8787}:8787"
      - "127.0.0.1:${ORCH_WS_PORT:-8788}:8788"
    depends_on:
      db:
        condition: service_healthy
      opencode:
        condition: service_healthy
    profiles: ["full"]

  # ---------------------------------------------------------------------------
  # Dashboard: UI Angular servida por nginx, con proxy a /api y /ws.
  # ---------------------------------------------------------------------------
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: ad-dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-4200}:80"
    depends_on:
      - orchestrator
    profiles: ["full"]
